<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Registro de Usuario</title>
</head>
<body>
    <h1>Editar usuario {{ usuario.id }}</h1>

    <form action="/Editar/{{ usuario.id }}" method="post">
        <input type="hidden" name="id" value="{{ usuario.id }}">
        <label for="nombre">Nombre:</label><br>
        <input type="text" name="nombre" required value="{{ usuario.nombre }}"><br>
        <label for="apellido">Apellido:</label><br>
        <input type="text" name="apellido" required value="{{ usuario.apellido }}"><br>
        <label for="email">E-mail</label><br>
        <input type="email" name="email" required value="{{ usuario.email }}"><br>
        <input type="submit" value="Actualizar">
    </form>
</body>
</html>
