<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <h1>Editar usuario {{ usuario.id }}</h1>

    <form action="/Editar/{{ usuario.id }}" method="post">
        <input type="hidden" name="id" value="{{ usuario.id }}">
        <label for="nombre">Nombre:</label><br>
        <input type="text" name="nombre" required value="{{ usuario.nombre }}"><br>
        <label for="apellido">Apellido:</label><br>
        <input type="text" name="apellido" required value="{{ usuario.apellido }}"><br>
        <label for="email">E-mail</label><br>
        <input type="email" name="email" required value="{{ usuario.email }}"><br>
        <input type="submit" value="Actualizar">
    </form>
</body>
</html>
