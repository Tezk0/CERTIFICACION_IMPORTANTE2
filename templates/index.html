<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Usuarios</title>
</head>
<body>
    <h1 class="titulodelindexsigma">Usuarios</h1>
    <a href="/usuario_nuevo">Nuevo Usuario</a>    

    <table class="tablasigmatoilet">
    <thead>
        <tr>
            <th class="tablainicio">id</th>
            <th>Nombre completo</th>
            <th>E-mail</th>
            <th>Fecha Creación</th>
            <th class="tablafin">Acciones</th>
        </tr>
    </thead>
    <tbody>
    {% for usuario in usuarios %}   
        <td>
            {{ usuario.id }}
        </td>
        <td>
            {{ usuario.nombre }} {{ usuario.apellido }}
        </td>
        <td>
            {{ usuario.email }}
        </td>
        <td>
            {{ usuario.created_at.strftime('%m/%d/%Y') }} 
        </td>
    
        <td>
            <a href="/usuario/{{ usuario.id }}">Ver</a>
            <a href="/editar/{{ usuario.id }}">Editar</a>
            <a href="/borrar/{{ usuario.id }}">Borrar</a>
        </td>
    </tbody>
    {% endfor %}
    </table>
</body>
</html>
