<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
</head>
<body>
    <h1>Usuarios</h1>
    <a href="">Nuevo Usuario</a>

    <table border="1">
    {% for usuario in usuarios %}
        <tr>
            <th>id</th>
            <th>Nombre completo</th>
            <th>E-mail</th>
            <th>Fecha Creación</th>
            <th>Acciones</th>
        </tr>
        <tr>
            {{ usuario.id }}
        </tr>
        <tr>
            {{ usuario.nombre }} {{ usuario.apellido }}
        </tr>
        <tr>
            {{ usuario.email }}
        </tr>
        <tr>
            *-+usuario.created_at.strftime('%m/%d/%Y') }} 
        </tr>
        <tr>
            <a href="">Ver</a>
            <a href="">Editar</a>
            <a href="">Borrar</a>
        </tr>
    {% endfor %}
    </table>
</body>
</html>
